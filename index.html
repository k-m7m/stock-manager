<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式ポートフォリオ管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 株式ポートフォリオ管理</h1>
        </header>

        <main>
            <!-- 銘柄追加フォーム -->
            <section class="add-stock-section">
                <h2>銘柄を追加</h2>
                <p class="form-description">株コードと株数を入力すると、最新の株価・配当情報を自動取得します</p>
                <form id="stockForm">
                    <div class="form-grid-simple">
                        <div class="form-group">
                            <label for="stockCode">証券コード</label>
                            <input type="text" id="stockCode" placeholder="例: 7203 (トヨタ)" required pattern="[0-9]{4}" title="4桁の証券コードを入力してください">
                            <small class="input-hint">4桁の証券コード</small>
                        </div>
                        <div class="form-group">
                            <label for="shares">購入株数</label>
                            <input type="number" id="shares" placeholder="100" min="1" required>
                            <small class="input-hint">保有する株数</small>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span class="btn-text">追加</span>
                            <span class="btn-loading" style="display: none;">取得中...</span>
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">キャンセル</button>
                    </div>
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                </form>
            </section>

            <!-- ポートフォリオ一覧 -->
            <section class="portfolio-section">
                <h2>保有銘柄一覧</h2>
                <div class="portfolio-actions">
                    <button type="button" class="btn btn-refresh" id="refreshAllBtn">
                        <span class="btn-text">全銘柄を更新</span>
                        <span class="btn-loading" style="display: none;">更新中...</span>
                    </button>
                </div>
                <div class="table-responsive">
                    <table id="portfolioTable">
                        <thead>
                            <tr>
                                <th>証券コード</th>
                                <th>銘柄名</th>
                                <th>購入株数</th>
                                <th>現在株価 (円)</th>
                                <th>評価額 (円)</th>
                                <th>配当利回り (%)</th>
                                <th>年間配当金額 (円/株)</th>
                                <th>年間配当総額 (円)</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="portfolioBody">
                            <!-- データは動的に挿入されます -->
                        </tbody>
                        <tfoot id="portfolioFooter" style="display: none;">
                            <tr class="total-row">
                                <td colspan="3"><strong>合計</strong></td>
                                <td><strong id="totalValue">0</strong></td>
                                <td colspan="2"></td>
                                <td><strong id="totalDividend">0</strong></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div id="emptyState" class="empty-state">
                    <p>まだ銘柄が登録されていません。<br>上のフォームから銘柄を追加してください。</p>
                </div>
            </section>
        </main>

        <footer>
            <p>データはブラウザのローカルストレージに保存されます</p>
            <p class="api-notice">株価・配当データはYahoo Finance APIから取得しています（市場の取引時間外は前日終値を表示）</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
