<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式ポートフォリオ管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 株式ポートフォリオ管理</h1>
        </header>

        <main>
            <!-- 銘柄追加フォーム -->
            <section class="add-stock-section">
                <h2>銘柄を追加</h2>
                <form id="stockForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="stockName">銘柄名</label>
                            <input type="text" id="stockName" placeholder="例: トヨタ自動車" required>
                        </div>
                        <div class="form-group">
                            <label for="shares">購入株数</label>
                            <input type="number" id="shares" placeholder="100" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="currentPrice">現在株価 (円)</label>
                            <input type="number" id="currentPrice" placeholder="2000" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="dividendYield">配当利回り (%)</label>
                            <input type="number" id="dividendYield" placeholder="3.5" min="0" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">追加</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">キャンセル</button>
                    </div>
                </form>
            </section>

            <!-- ポートフォリオ一覧 -->
            <section class="portfolio-section">
                <h2>保有銘柄一覧</h2>
                <div class="table-responsive">
                    <table id="portfolioTable">
                        <thead>
                            <tr>
                                <th>銘柄名</th>
                                <th>購入株数</th>
                                <th>現在株価 (円)</th>
                                <th>評価額 (円)</th>
                                <th>配当利回り (%)</th>
                                <th>年間配当金額 (円/株)</th>
                                <th>年間配当総額 (円)</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="portfolioBody">
                            <!-- データは動的に挿入されます -->
                        </tbody>
                        <tfoot id="portfolioFooter" style="display: none;">
                            <tr class="total-row">
                                <td colspan="3"><strong>合計</strong></td>
                                <td><strong id="totalValue">0</strong></td>
                                <td colspan="2"></td>
                                <td><strong id="totalDividend">0</strong></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div id="emptyState" class="empty-state">
                    <p>まだ銘柄が登録されていません。<br>上のフォームから銘柄を追加してください。</p>
                </div>
            </section>
        </main>

        <footer>
            <p>データはブラウザのローカルストレージに保存されます</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
